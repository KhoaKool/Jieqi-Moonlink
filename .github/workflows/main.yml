name: Build Optimized Bot (Nhanh & Nhẹ)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Tải Source Code Gốc (Không làm lại cái có sẵn)
      uses: actions/checkout@v4
      with:
        repository: lxsgx23/Jieqi-Moonlink
        ref: v1.01

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Lưu cache lại để các lần sau build siêu tốc không phải tải lại thư viện

    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pygame ultralytics opencv-python pyautogui keyboard mss PyQt5 Pillow numpy requests pydirectinput pypiwin32 psutil

    - name: Build file EXE siêu nhẹ (Chỉ chứa code)
      run: |
        pyinstaller --onefile --windowed main.py

    - name: Dọn rác & Sắp xếp lại như cũ
      run: |
        # Đưa file exe ra ngoài, đặt cạnh các thư mục AI/Data có sẵn của tác giả
        Move-Item dist\main.exe .\main.exe -Force
        
        # Xóa các file rác sinh ra trong quá trình build để file tải về nhẹ nhất có thể
        Remove-Item build, dist, *.spec, .git, .github -Recurse -Force -ErrorAction SilentlyContinue

    - name: Đóng gói thành 1 cục Zip
      uses: actions/upload-artifact@v4
      with:
        name: Jieqi-Moonlink-Optimized-Ready
        path: ./*
