name: Build EXE for Windows

on:
  workflow_dispatch: # Nút bấm để bạn có thể chạy quy trình này thủ công bất cứ lúc nào

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest # Bắt buộc phải dùng môi trường Windows để tạo file .exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Khuyến nghị bản 3.10 cho độ ổn định với các thư viện AI

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Nếu dự án có file requirements.txt
        pip install -r requirements.txt
        
        # LƯU Ý: Nếu tác giả không có requirements.txt, hãy xóa dòng trên và dùng dòng dưới:
        # pip install ultralytics opencv-python pyautogui (thêm các thư viện cần thiết vào đây)

    - name: Build with Pyinstaller
      run: |
        # Thay 'main.py' bằng tên file chạy chính thức của dự án nếu tác giả đặt tên khác
        pyinstaller --onefile --windowed main.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Jieqi-Moonlink-Release
        path: dist/main.exe
        # retention-days: 7 (Tùy chọn: Xóa file sau 7 ngày để đỡ tốn dung lượng GitHub)
