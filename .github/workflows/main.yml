name: 1-Click Bot Builder (Cho Người Lười)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Clone Code Bản Chuẩn v1.01
      uses: actions/checkout@v4
      with:
        repository: lxsgx23/Jieqi-Moonlink
        ref: v1.01

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cài đặt tất tần tật thư viện (Bao gồm cả pygame)
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pygame ultralytics opencv-python pyautogui keyboard mss PyQt5 Pillow numpy requests pydirectinput pypiwin32 psutil

    - name: Phép Thuật Hợp Nhất (Gom Data vào 1 file EXE)
      run: |
        # 1. Chèn mã để Tool tự tìm thấy Data khi bị nén vào 1 file
        $patch = "import os, sys`nif hasattr(sys, '_MEIPASS'):`n    os.chdir(sys._MEIPASS)`n"
        $original = Get-Content main.py -Raw
        Set-Content main.py -Value ($patch + $original)

        # 2. Quét toàn bộ kho của tác giả và nhồi chung vào EXE
        $items = Get-ChildItem -Exclude ".git", ".github", "main.py", "build", "dist"
        $cmd = "pyinstaller --onefile --windowed --name `"AutoBot_Jieqi`" "
        foreach ($item in $items) {
            $cmd += "--add-data `"$($item.Name);$($item.Name)`" "
        }
        $cmd += "main.py"
        
        Invoke-Expression $cmd

    - name: Trả hàng cho sếp
      uses: actions/upload-artifact@v4
      with:
        name: AutoBot_Jieqi_1Click
        path: dist/AutoBot_Jieqi.exe
